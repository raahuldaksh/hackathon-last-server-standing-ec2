# Linux Kernel Network & File Tuning for Last Server Standing (EC2 m7i.large)
# Place in /etc/sysctl.d/99-last-server.conf and run: sudo sysctl --system

# Max open socket connections backlog
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# Fast socket recycling and reuse
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# Ephemeral port range expansion
net.ipv4.ip_local_port_range = 1024 65535

# Maximum open file descriptors
fs.file-max = 2097152

# Increase network device queue length
net.core.netdev_max_backlog = 16384

# Max TCP buffer sizes
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
